[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Path bootstrap has to run before the package import when the file is executed as a script.
"src/train.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
